# Fill missing AI texts (Round 8): once a day, after the Gemini free-tier quota resets, fill ONLY what is missing —
# saved Ask answers (web/public/data/v1/ask_cache.json) and Fire Watch briefings for flagged regions (watch_cache.json).
# Same server-side number verification as the live app (api/_lib/core.ts): unverified answers are never saved.
# The scripts stop at the first quota error and leave the rest for the next day. Commits only if something new was saved.
# Runs 08:37 UTC (12:37 Mauritius) and on demand (Actions → "Fill missing AI texts" → Run workflow).
name: Fill missing AI texts

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates          # shared with daily.yml and retrain.yml: never runs at the same time as a data update
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web packages
        working-directory: web
        run: npm ci

      - name: Fill missing Fire Watch briefings (flagged regions without a saved briefing)
        if: env.GEMINI_API_KEY != ''
        working-directory: web
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/watch_cache.ts --missing || echo "briefing script failed — nothing saved from it"

      - name: Fill missing saved Ask answers
        if: env.GEMINI_API_KEY != ''
        working-directory: web
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/ask_cache.ts --missing || echo "ask cache script failed — nothing saved from it"

      - name: Commit and push as Muru265 (only if something new was saved)
        run: |
          git config user.name "Muru265"
          git config user.email "225575093+Muru265@users.noreply.github.com"
          git add web/public/data/v1/ask_cache.json web/public/data/v1/watch_cache.json
          if git diff --cached --quiet; then echo "nothing new saved"; exit 0; fi
          git commit -m "Fill missing AI texts $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
