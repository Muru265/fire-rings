# Automatic monthly retraining of the "fire likelihood next month" model (Round 5B, Part E).
# Runs on the 2nd of every month at 03:17 UTC (off-peak) and on demand (Actions → "Monthly model retrain" → Run workflow).
# Uses only committed files + a few small FIRMS API calls (FIRMS_MAP_KEY secret, never echoed). Any failure → no commit,
# the job fails visibly and the site keeps the last good version. Not reinforcement learning: a fixed test decides.
name: Monthly model retrain

on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no FIRMS calls, no commit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-updates          # shared with daily.yml: daily and monthly never run at the same time
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python packages (pinned)
        run: pip install -r pipeline/requirements.txt

      - name: Snapshot the Long-term record (must not change)
        run: sha256sum web/public/data/v1/regions/*.json web/public/data/v1/dataset/* > /tmp/record.sha

      - name: Fetch newest NRT months, retrain, decide
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python pipeline/retrain.py --dry-run
          else
            python pipeline/retrain.py
          fi

      - name: Long-term record unchanged
        run: sha256sum -c /tmp/record.sha --quiet

      - name: pytest
        run: python -m pytest pipeline/tests -q

      - uses: actions/setup-node@v4
        if: ${{ inputs.dry_run != true }}
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: claims_check (every number on the site vs the published JSON)
        if: ${{ inputs.dry_run != true }}
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx vite build
          node scripts/claims_check.mjs

      - name: Only model files may change
        if: ${{ inputs.dry_run != true }}
        run: |
          git status --porcelain
          bad=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(pipeline/assets/model/|web/public/data/v1/api/(likelihood/|model_card\.json|model_history\.json))' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes: $bad"; exit 1; fi

      - name: Commit and push as Muru265 (Vercel deploys)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Muru265"
          git config user.email "225575093+Muru265@users.noreply.github.com"
          git add pipeline/assets/model web/public/data/v1/api/likelihood web/public/data/v1/api/model_card.json web/public/data/v1/api/model_history.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Monthly model retrain $(date -u +%Y-%m-%d)"
          git push
