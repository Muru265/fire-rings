# Daily data update (Round 6): refreshes ONLY the current month ("this month so far") from NASA FIRMS near-real-time data.
# Runs every day at 04:40 UTC and on demand (Actions → "Daily data update" → Run workflow).
# What it rewrites: the current month row + latest/annual of regions/*.json, daily/*.json, globe/hexes for the current month,
# meta.json ("last update"), the open CSV/parquet rows of the current month, watch.json, api/series + api/projection.
# What it never touches: months before config `daily.first_month` (the Long-term record — the snapshot test checks this)
# and the prediction model (monthly: retrain.yml). Fire Watch AI briefings are regenerated only for regions whose status
# changed; if Gemini fails the previous saved briefing is kept. Keys come from repository secrets and are never echoed.
name: Daily data update

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates          # shared with retrain.yml: daily and monthly never run at the same time
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # Round 8: GOES month-to-date sample for Mato Grosso (anonymous S3) adds a few minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python packages (pinned)
        run: pip install -r pipeline/requirements.txt

      - name: Fetch this month's NRT detections, recompute the current month, run the agentic check
        # Agent (pipeline/12_agent.py, run by daily.py): A detection times always; B MCD64A1 burned area only if the
        # Earthdata secrets exist (new months only — summaries are cached in pipeline/assets/agent/); C2 Meteosat only if
        # the LSA SAF secrets exist. A missing secret gives "unavailable" / "pending access", never a failed run.
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          LSASAF_USER: ${{ secrets.LSASAF_USER }}
          LSASAF_PASS: ${{ secrets.LSASAF_PASS }}
        run: python pipeline/daily.py

      - name: pytest (incl. the Long-term snapshot test)
        run: python -m pytest pipeline/tests -q

      - name: Only current-month outputs may change
        run: |
          git status --porcelain
          bad=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(pipeline/assets/daily/|pipeline/assets/agent/|web/public/data/v1/(regions/|daily/|api/series/|api/projection/|api/agent_check/|api/index\.json|meta\.json|watch\.json|globe\.json|hexes/[a-z_]+/[0-9]{4}\.json|dataset/harmonized_monthly_regions_v1\.(csv|parquet)))' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes: $bad"; exit 1; fi

      - name: Which Fire Watch statuses changed?
        id: status
        run: echo "changed=$(cat data/daily_status_changed.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.status.outputs.changed != ''
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate AI briefings for changed regions only (keeps the previous one if Gemini fails)
        if: steps.status.outputs.changed != ''
        working-directory: web
        run: |
          npm ci
          if ! npx tsx scripts/watch_cache.ts --only "$CHANGED"; then   # regions whose status OR agent verdict changed
            echo "briefing script failed — restoring the previous saved briefings"
            git checkout -- public/data/v1/watch_cache.json
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED: ${{ steps.status.outputs.changed }}

      - name: Commit and push as Muru265 (Vercel deploys)
        run: |
          git config user.name "Muru265"
          git config user.email "225575093+Muru265@users.noreply.github.com"
          git add pipeline/assets/daily pipeline/assets/agent web/public/data/v1
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
