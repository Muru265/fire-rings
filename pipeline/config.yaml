# Fire Rings pipeline configuration (SOLO SCOPE — see CLAUDE.md)
version: v1
paths:
  raw: data/raw
  clean: data/clean
  cube: data/cube
  out: data/out
  web: web/public/data/v1

# Sensor folders → FIRMS file codes. Stream is derived from the `satellite` column, never `instrument`.
sensors:
  modis:  {code: M-C61,  satellites: {Terra: TERRA, Aqua: AQUA}}
  snpp:   {code: SV-C2,  satellites: {SNPP: SNPP}}
  noaa20: {code: J1V-C2, satellites: {N20: N20}}
  noaa21: {code: J2V-C2, satellites: {N21: N21}}

# bbox = [W, S, E, N]; null = keep the whole source file (already clipped to the country by FIRMS)
regions:
  punjab:
    name: Punjab–Haryana
    source: india
    bbox: [73.8, 27.6, 77.6, 32.6]
    footprint_res: 7    # India-only footprint for live/API rows (box also covers Pakistani Punjab)
  madagascar:
    name: Madagascar
    source: madagascar
    bbox: null
  se_australia:
    name: SE Australia (NSW + VIC)
    source: australia
    bbox: [140.9, -39.2, 153.7, -28.1]
  mauritius:
    name: Mauritius (incl. Rodrigues)
    source: mauritius
    bbox: null
    note: Republic of Mauritius as delivered by FIRMS (includes Rodrigues, excludes Réunion)
    inset_name: Rodrigues

filters:
  drop_conf: [L]           # MODIS 0–29, VIIRS 'l'
  drop_types: [1, 2, 3]    # archive only; NRT has no type column (kept as NULL)
  modis_conf_bins: [30, 80] # <30 L, 30–79 N, >=80 H

mask:
  h3_res: 9
  min_detection_days: 16
  min_years: 3
  max_seasonality: 0.3

cube:
  h3_res: 6
  coverage_min_ratio: 0.6
  operating_days_source: australia   # largest file → per-stream operating-days proxy

calibration:
  window: ["2012-07", "2019-12"]
  q_window: ["2002-07", "2019-12"]
  kprime_window: ["2018-04", "2026-07"]
  tau_grid: [10, 30, 100, 300]
  bootstrap_n: 500
  uncertain_rel_width: 0.5
  seed: 20261114

harmonized_segments:      # inclusive month ranges
  - {from: "2001-01", to: "2002-06", src: T}    # q · Terra
  - {from: "2002-07", to: "2011-12", src: M}    # Terra ∪ Aqua
  - {from: "2012-01", to: "2026-10", src: V}    # k · S-NPP
  - {from: "2026-11", to: null,      src: V2}   # k · k' · NOAA-20

stats:
  baseline: [2003, 2022]
  guard_median_lt: 5
  guard_value_lt: 10
  similar_years_top: 3

# Fire Watch (agentic monitoring). Rules decide, AI explains. The ONE place these thresholds live: 07c_watch.py applies
# them to the record and the raw-vs-harmonized backtest, /api/watch adds the live rule, METHODS.md §8e documents them.
watch:
  alert_pct: 95           # Alert: the month is above every baseline year (percentile range low end ≥ 95 = top of 20 years) or beyond record
  far_above_pct: 90       # Watch ("far above normal"): percentile range low end ≥ 90 (above P90 even at the low end of our uncertainty)
  far_below_pct: 10       # Unusually low ("far below normal"): percentile range high end ≤ 10 (below P10 even at the high end)
  live_spike_ratio: 3     # Live spike → Watch (never Alert): live 72 h detections ≥ 3 × expected 72 h detections
  live_min_expected: 20   # no live rule when fewer than 20 detections are expected in 72 h (low-activity guard for the live feed)
  live_satellites: 2      # the live feed is NOAA-20 + NOAA-21; the expected count is built from one satellite (S-NPP) in the record
  live_baseline: [2013, 2022]
  backtest: ["2012-01", "2025-12"]
  relevant_for:           # fixed mapping, one line per alert (no forecasts)
    punjab_octnov: "air-quality and health agencies (Oct–Nov crop-residue smoke), researchers and journalists"
    punjab: "agriculture and air-quality agencies, researchers and journalists"
    madagascar: "fire services, land managers and conservation teams, researchers and journalists"
    se_australia: "fire services and land managers, researchers and journalists"
    mauritius: "land managers, researchers and journalists"

record:
  start: "2001-01"
  data_end: "2026-11-08"

# P1.2 pre-saved hotspot months (static files; the demo never depends on NASA live). 08b_demo_hotspots.py
demo_hotspots:
  - {region: punjab, month: "2016-10", note: "Punjab crop-residue burning season"}
  - {region: se_australia, month: "2019-12", note: "Black Summer"}
  - {region: madagascar, month: "2019-09", note: "Madagascar dry-season burning"}
